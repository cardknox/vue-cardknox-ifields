name: Safe Chain

# Supply-chain gate for both packages in this repo - vue-cardknox-ifields and test -
# so every package-lock.json in the tree is covered. Aikido Safe Chain installs PATH
# shims once per job, so every npm invocation below is intercepted and known-malicious
# packages are blocked before their install scripts can execute.
#
# Both installs run before any build: a poisoned lockfile in either package should be
# caught by the gate rather than by a build step that happens to run first.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Safe Chain release and the sha256 of its installer script.
  # To upgrade, bump the version and take the matching digest from the release asset:
  #   gh api repos/AikidoSec/safe-chain/releases/tags/<version> \
  #     --jq '.assets[] | select(.name == "install-safe-chain.sh") | .digest'
  SAFE_CHAIN_VERSION: 1.5.15
  SAFE_CHAIN_INSTALLER_SHA256: de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2

jobs:
  safe-chain:
    name: Safe Chain gate, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: vue-cardknox-ifields

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must run before Safe Chain: setup-node prepends its own bin directory to
      # PATH, which would otherwise shadow the Safe Chain npm shims.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            vue-cardknox-ifields/package-lock.json
            test/package-lock.json

      - name: Install Safe Chain
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" \
            -o /tmp/install-safe-chain.sh
          echo "${SAFE_CHAIN_INSTALLER_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          # --ci installs PATH shims for npm/npx/yarn/pnpm instead of shell aliases
          # and appends the shim directory to $GITHUB_PATH for later steps.
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # The shims fall back to the real package manager with only a warning if
      # Safe Chain is unreachable, so fail loudly here rather than running the
      # rest of the job unprotected.
      - name: Verify Safe Chain is active
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          safe-chain --version
          echo "npm resolves to: $(command -v npm)"
          output="$(npm safe-chain-verify 2>&1)" || true
          echo "$output"
          case "$output" in
            *"OK: Safe-chain works"*) echo "Safe Chain is intercepting npm." ;;
            *) echo "::error::Safe Chain is not intercepting npm - refusing to install dependencies."; exit 1 ;;
          esac

      - name: Install dependencies (vue-cardknox-ifields)
        run: npm ci

      # `npm ci` here only links vue-cardknox-ifields (file: dependency, "link": true
      # in the lockfile), so it does not need the library built yet - which lets both
      # lockfiles clear the gate before any build runs.
      - name: Install dependencies (test app)
        working-directory: test
        run: npm ci

      - name: Build vue-cardknox-ifields
        run: npm run build

      # `npm run build` backgrounds two of its three sub-builds with `&`, so its
      # exit code only reflects the last one. Check the artifacts instead.
      - name: Verify build output
        run: |
          set -euo pipefail
          for file in \
            dist/vue-cardknox-ifields.umd.js \
            dist/vue-cardknox-ifields.esm.js \
            dist/vue-cardknox-ifields.min.js
          do
            if [ ! -s "$file" ]; then
              echo "::error::Build did not produce $file"
              exit 1
            fi
            echo "OK $file ($(wc -c <"$file") bytes)"
          done

      # No-op until the package gains a test script.
      - name: Test vue-cardknox-ifields
        run: npm test --if-present

      # Smoke test: test consumes the built library via file:../vue-cardknox-ifields,
      # so building it proves the published entry points actually resolve and bundle.
      # This is why the builds stay sequential in one job rather than a matrix - the
      # test build needs dist/ from the step above.
      - name: Build test app
        working-directory: test
        run: npm run build

      # No-op until the test app gains a test script.
      - name: Test test app
        working-directory: test
        run: npm test --if-present
